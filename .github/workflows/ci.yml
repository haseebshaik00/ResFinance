name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.2"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install pinned Python dependencies
        run: pip install -r requirements/requirements-dev.txt -r requirements/requirements-milestone0.txt -r requirements/requirements-api.txt -r requirements/requirements-ml.txt -r requirements/requirements-portfolio.txt -r requirements/requirements-ai.txt
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Test
        run: pytest
      - name: Verify generated OpenAPI
        run: |
          python -m scripts.generate_openapi
          git diff --exit-code -- openapi/openapi.json
      - name: Validate Compose configuration
        run: docker compose config --quiet

  client:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install pinned client dependencies
        working-directory: client
        run: npm ci
      - name: Verify generated API types
        working-directory: client
        run: |
          npm run generate:api
          git diff --exit-code -- src/lib/api/generated/schema.d.ts
      - name: Type check
        working-directory: client
        run: npm run check
      - name: Lint
        working-directory: client
        run: npm run lint
      - name: Format check
        working-directory: client
        run: npm run format:check
      - name: Test
        working-directory: client
        run: npm test
      - name: Build
        working-directory: client
        run: npm run build
      - name: Install Playwright Chromium
        working-directory: client
        run: npx playwright install --with-deps chromium
      - name: Browser acceptance
        working-directory: client
        run: npm run test:e2e

  reswallet:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: reswallet/package-lock.json
      - name: Install pinned ResWallet dependencies
        working-directory: reswallet
        run: npm ci
      - name: Type check
        working-directory: reswallet
        run: npm run check
      - name: Lint
        working-directory: reswallet
        run: npm run lint
      - name: Format check
        working-directory: reswallet
        run: npm run format:check
      - name: Test
        working-directory: reswallet
        run: npm test
      - name: Build and inspect security boundary
        working-directory: reswallet
        run: |
          npm run build
          npm run security:inspect
